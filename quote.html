<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LIBRA DESIGN</title>
    <link href="./home.css" rel="stylesheet" />
    <link href="./style.css" rel="stylesheet" />
  </head>
  <body class="quote">
    <!-- banner -->
    <section class="hero-section">
      <div class="hero-box">
        <img src="./assets/images/banner.png" alt="Hero" class="hero-about" />

        <div class="hero-nav">
          <ul class="bebas hero-nav-list">
            <li><a href="#">Home</a></li>
            <li><a href="#">About Us</a></li>
            <li><a href="#">Portfolio</a></li>
            <li><a href="#">Contact</a></li>
          </ul>
        </div>

        <div class="hero-logo">
          <img src="./assets/images/logo_small.png" alt="Creative Print" />
        </div>

        <div class="abt-text">
          <h1 class="bebas abt-heading">
            Request a <br />
            <span class="highlight">Quote </span>
          </h1>
        </div>

        <div class="hero-image-wrapper">
          <img
            src="./assets/images/brain-small.png"
            alt="Creative Print"
            class="hero-image"
          />
        </div>
      </div>
    </section>
    <section class="container">
      <div class="quote-form-container">
        <div class="form-header">
          <h2>REQUEST A QUOTE</h2>
          <p>
            Tell us your printing needs and we’ll get back with a custom
            quotation.
          </p>
        </div>

        <form>
          <div class="form-grid">
            <!-- Personal Information -->
            <div class="form-section">
              <h3>Personal Information</h3>
              <label for="fullname">Full Name *</label>
              <input
                type="text"
                id="fullname"
                placeholder="John Doe"
                required
              />

              <label for="email">E-mail Address *</label>
              <input
                type="email"
                id="email"
                placeholder="your_email@example.com"
                required
              />

              <label for="phone">Phone Number *</label>
              <input
                type="tel"
                id="phone"
                placeholder="( _ ) ___ - ____"
                required
              />

              <label for="company">Company Name</label>
              <input type="text" id="company" placeholder="If Available" />
            </div>

            <!-- Project Information -->
            <div class="form-section">
              <h3>Project Information</h3>
              <label for="service">Printing Service Type</label>
              <select id="service">
                <option>Select Service</option>
                <option>Flyers</option>
                <option>Brochures</option>
                <option>Business Cards</option>
              </select>

              <label for="quantity">Quantity Needed</label>
              <input type="number" id="quantity" placeholder="0" />

              <label for="material">Paper/Material Type</label>
              <select id="material">
                <option>Glossy</option>
                <option>Matte</option>
                <option>Textured</option>
              </select>

              <label for="size">Size</label>
              <input type="text" id="size" placeholder="e.g. A4, A5, Custom" />
            </div>

            <!-- Additional Information -->
            <hr />
            <div class="form-section full-width">
              <h3>Additional Information</h3>
              <label for="file">Upload File</label>
              <input type="file" id="file" />

              <label for="notes">Additional Notes</label>
              <textarea id="notes"></textarea>
            </div>
          </div>

          <div class="form-actions">
            <button type="submit">Submit Request</button>
          </div>
        </form>
      </div>
    </section>
    <footer id="footer"></footer>
    <script>
      // Load footer.html content
      fetch("footer.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("footer").innerHTML = data;
        });
    </script>
  </body>
</html>
